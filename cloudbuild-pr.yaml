# Cloud Build: PHP (FPM and CLI) image for SitesPanel.
# Pull-request build: builds and scans only. Nothing is pushed and no secret is read.
# To save build-minutes it builds a representative subset: php-8.5-fpm, php-8.5-cli; the publish build builds all.

substitutions:
  _REGISTRY: ghcr.io/sitespanel

steps:
  # The extensions the image installs must exist upstream.
  - id: extensions-check
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        curl -fsSL https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/data/supported-extensions -o data/supported-extensions
        missing=""
        while IFS= read -r ext; do
          [ -z "$$ext" ] && continue
          grep -q "^$$ext " data/supported-extensions || missing="$$missing $$ext"
        done < data/installable-extensions
        if [ -n "$$missing" ]; then echo "unknown extensions:$$missing"; exit 1; fi
        echo "all installable extensions exist upstream"
  - id: build-php-8.5-fpm
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.5
      - --build-arg=IMAGE_TYPE=fpm
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP images: PHP-FPM and CLI for PHP 8.3 to 8.5 on Debian trixie, with Composer, WP-CLI and Node.js.
      - --tag=${_REGISTRY}/php:8.5-fpm-trixie
      - --tag=${_REGISTRY}/php:8.5-fpm
      - --tag=${_REGISTRY}/php:8.5-fpm-trixie-$SHORT_SHA
      - --tag=${_REGISTRY}/php:latest-fpm
      - .
    waitFor: ['extensions-check']
  - id: scan-php-8.5-fpm
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.5-fpm.tar ${_REGISTRY}/php:8.5-fpm-trixie']
    waitFor: ['build-php-8.5-fpm']
  - id: trivy-php-8.5-fpm
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.5-fpm.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f /workspace/php-8.5-fpm.tar
    waitFor: ['scan-php-8.5-fpm']
  - id: build-php-8.5-cli
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.5
      - --build-arg=IMAGE_TYPE=cli
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP images: PHP-FPM and CLI for PHP 8.3 to 8.5 on Debian trixie, with Composer, WP-CLI and Node.js.
      - --tag=${_REGISTRY}/php:8.5-cli-trixie
      - --tag=${_REGISTRY}/php:8.5-cli
      - --tag=${_REGISTRY}/php:8.5-cli-trixie-$SHORT_SHA
      - --tag=${_REGISTRY}/php:latest-cli
      - .
    waitFor: ['trivy-php-8.5-fpm']
  - id: scan-php-8.5-cli
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.5-cli.tar ${_REGISTRY}/php:8.5-cli-trixie']
    waitFor: ['build-php-8.5-cli']
  - id: trivy-php-8.5-cli
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.5-cli.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f /workspace/php-8.5-cli.tar
    waitFor: ['scan-php-8.5-cli']

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

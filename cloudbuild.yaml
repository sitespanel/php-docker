# Cloud Build: PHP (FPM and CLI) image for SitesPanel.
# Publish build: a push to main and the weekly rebuild. Builds one image after another on the default
# machine (the free build-minutes apply only to it), scans each with Trivy, and pushes to ghcr.io only when
# every scan passed; then attaches each image's SPDX SBOM to its digest (SitesPanel ADR-0065).

substitutions:
  _REGISTRY: ghcr.io/sitespanel
  _GHCR_USER: sitespanel-image-builder  # the GitHub account that owns the push token
  _GHCR_TOKEN_SECRET: sitespanel-ghcr-image-push-token-cloudbuild  # Secret Manager secret holding the token

steps:
  # The extensions the image installs must exist upstream.
  - id: extensions-check
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        curl -fsSL https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/data/supported-extensions -o data/supported-extensions
        missing=""
        while IFS= read -r ext; do
          [ -z "$$ext" ] && continue
          grep -q "^$$ext " data/supported-extensions || missing="$$missing $$ext"
        done < data/installable-extensions
        if [ -n "$$missing" ]; then echo "unknown extensions:$$missing"; exit 1; fi
        echo "all installable extensions exist upstream"
  - id: build-php-8.3-fpm
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.3
      - --build-arg=IMAGE_TYPE=fpm
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP (FPM and CLI) image
      - --tag=${_REGISTRY}/php:8.3-fpm-trixie
      - --tag=${_REGISTRY}/php:8.3-fpm
      - --tag=${_REGISTRY}/php:8.3-fpm-trixie-$SHORT_SHA
      - .
    waitFor: ['extensions-check']
  - id: scan-php-8.3-fpm
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.3-fpm.tar ${_REGISTRY}/php:8.3-fpm-trixie']
    waitFor: ['build-php-8.3-fpm']
  - id: trivy-php-8.3-fpm
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.3-fpm.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.3-fpm.tar --format spdx-json --output /workspace/sbom/php-8.3-fpm.spdx.json
        rm -f /workspace/php-8.3-fpm.tar
    waitFor: ['scan-php-8.3-fpm']
  - id: build-php-8.3-cli
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.3
      - --build-arg=IMAGE_TYPE=cli
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP (FPM and CLI) image
      - --tag=${_REGISTRY}/php:8.3-cli-trixie
      - --tag=${_REGISTRY}/php:8.3-cli
      - --tag=${_REGISTRY}/php:8.3-cli-trixie-$SHORT_SHA
      - .
    waitFor: ['trivy-php-8.3-fpm']
  - id: scan-php-8.3-cli
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.3-cli.tar ${_REGISTRY}/php:8.3-cli-trixie']
    waitFor: ['build-php-8.3-cli']
  - id: trivy-php-8.3-cli
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.3-cli.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.3-cli.tar --format spdx-json --output /workspace/sbom/php-8.3-cli.spdx.json
        rm -f /workspace/php-8.3-cli.tar
    waitFor: ['scan-php-8.3-cli']
  - id: build-php-8.4-fpm
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.4
      - --build-arg=IMAGE_TYPE=fpm
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP (FPM and CLI) image
      - --tag=${_REGISTRY}/php:8.4-fpm-trixie
      - --tag=${_REGISTRY}/php:8.4-fpm
      - --tag=${_REGISTRY}/php:8.4-fpm-trixie-$SHORT_SHA
      - .
    waitFor: ['trivy-php-8.3-cli']
  - id: scan-php-8.4-fpm
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.4-fpm.tar ${_REGISTRY}/php:8.4-fpm-trixie']
    waitFor: ['build-php-8.4-fpm']
  - id: trivy-php-8.4-fpm
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.4-fpm.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.4-fpm.tar --format spdx-json --output /workspace/sbom/php-8.4-fpm.spdx.json
        rm -f /workspace/php-8.4-fpm.tar
    waitFor: ['scan-php-8.4-fpm']
  - id: build-php-8.4-cli
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.4
      - --build-arg=IMAGE_TYPE=cli
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP (FPM and CLI) image
      - --tag=${_REGISTRY}/php:8.4-cli-trixie
      - --tag=${_REGISTRY}/php:8.4-cli
      - --tag=${_REGISTRY}/php:8.4-cli-trixie-$SHORT_SHA
      - .
    waitFor: ['trivy-php-8.4-fpm']
  - id: scan-php-8.4-cli
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.4-cli.tar ${_REGISTRY}/php:8.4-cli-trixie']
    waitFor: ['build-php-8.4-cli']
  - id: trivy-php-8.4-cli
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.4-cli.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.4-cli.tar --format spdx-json --output /workspace/sbom/php-8.4-cli.spdx.json
        rm -f /workspace/php-8.4-cli.tar
    waitFor: ['scan-php-8.4-cli']
  - id: build-php-8.5-fpm
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.5
      - --build-arg=IMAGE_TYPE=fpm
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP (FPM and CLI) image
      - --tag=${_REGISTRY}/php:8.5-fpm-trixie
      - --tag=${_REGISTRY}/php:8.5-fpm
      - --tag=${_REGISTRY}/php:8.5-fpm-trixie-$SHORT_SHA
      - --tag=${_REGISTRY}/php:latest-fpm
      - .
    waitFor: ['trivy-php-8.4-cli']
  - id: scan-php-8.5-fpm
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.5-fpm.tar ${_REGISTRY}/php:8.5-fpm-trixie']
    waitFor: ['build-php-8.5-fpm']
  - id: trivy-php-8.5-fpm
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.5-fpm.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.5-fpm.tar --format spdx-json --output /workspace/sbom/php-8.5-fpm.spdx.json
        rm -f /workspace/php-8.5-fpm.tar
    waitFor: ['scan-php-8.5-fpm']
  - id: build-php-8.5-cli
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.5
      - --build-arg=IMAGE_TYPE=cli
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/php-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel PHP (FPM and CLI) image
      - --tag=${_REGISTRY}/php:8.5-cli-trixie
      - --tag=${_REGISTRY}/php:8.5-cli
      - --tag=${_REGISTRY}/php:8.5-cli-trixie-$SHORT_SHA
      - --tag=${_REGISTRY}/php:latest-cli
      - .
    waitFor: ['trivy-php-8.5-fpm']
  - id: scan-php-8.5-cli
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/php-8.5-cli.tar ${_REGISTRY}/php:8.5-cli-trixie']
    waitFor: ['build-php-8.5-cli']
  - id: trivy-php-8.5-cli
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.5-cli.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/php-8.5-cli.tar --format spdx-json --output /workspace/sbom/php-8.5-cli.spdx.json
        rm -f /workspace/php-8.5-cli.tar
    waitFor: ['scan-php-8.5-cli']
  # Push only after every scan passed. The token never appears in the log.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['GHCR_TOKEN']
    args:
      - -ceu
      - |
        echo "$$GHCR_TOKEN" | docker login ghcr.io --username ${_GHCR_USER} --password-stdin
        docker push ${_REGISTRY}/php:8.3-fpm-trixie
        docker push ${_REGISTRY}/php:8.3-fpm
        docker push ${_REGISTRY}/php:8.3-fpm-trixie-$SHORT_SHA
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/php:8.3-fpm-trixie > /workspace/php-8.3-fpm.digest
        docker push ${_REGISTRY}/php:8.3-cli-trixie
        docker push ${_REGISTRY}/php:8.3-cli
        docker push ${_REGISTRY}/php:8.3-cli-trixie-$SHORT_SHA
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/php:8.3-cli-trixie > /workspace/php-8.3-cli.digest
        docker push ${_REGISTRY}/php:8.4-fpm-trixie
        docker push ${_REGISTRY}/php:8.4-fpm
        docker push ${_REGISTRY}/php:8.4-fpm-trixie-$SHORT_SHA
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/php:8.4-fpm-trixie > /workspace/php-8.4-fpm.digest
        docker push ${_REGISTRY}/php:8.4-cli-trixie
        docker push ${_REGISTRY}/php:8.4-cli
        docker push ${_REGISTRY}/php:8.4-cli-trixie-$SHORT_SHA
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/php:8.4-cli-trixie > /workspace/php-8.4-cli.digest
        docker push ${_REGISTRY}/php:8.5-fpm-trixie
        docker push ${_REGISTRY}/php:8.5-fpm
        docker push ${_REGISTRY}/php:8.5-fpm-trixie-$SHORT_SHA
        docker push ${_REGISTRY}/php:latest-fpm
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/php:8.5-fpm-trixie > /workspace/php-8.5-fpm.digest
        docker push ${_REGISTRY}/php:8.5-cli-trixie
        docker push ${_REGISTRY}/php:8.5-cli
        docker push ${_REGISTRY}/php:8.5-cli-trixie-$SHORT_SHA
        docker push ${_REGISTRY}/php:latest-cli
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/php:8.5-cli-trixie > /workspace/php-8.5-cli.digest
    waitFor: ['trivy-php-8.5-cli']
  # Each SBOM is attached to its image's digest in ghcr.io, so it travels with the image.
  - id: sbom
    name: ghcr.io/oras-project/oras:v1.3.5@sha256:2f43a2bd4797df77ab38cf24ec92ae34a98a82cdf4ec507537e44081c603630e
    entrypoint: sh
    args:
      - -ceu
      - |
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/php-8.3-fpm.digest)" /workspace/sbom/php-8.3-fpm.spdx.json:application/spdx+json
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/php-8.3-cli.digest)" /workspace/sbom/php-8.3-cli.spdx.json:application/spdx+json
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/php-8.4-fpm.digest)" /workspace/sbom/php-8.4-fpm.spdx.json:application/spdx+json
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/php-8.4-cli.digest)" /workspace/sbom/php-8.4-cli.spdx.json:application/spdx+json
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/php-8.5-fpm.digest)" /workspace/sbom/php-8.5-fpm.spdx.json:application/spdx+json
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/php-8.5-cli.digest)" /workspace/sbom/php-8.5-cli.spdx.json:application/spdx+json
    waitFor: ['push']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_GHCR_TOKEN_SECRET}/versions/latest
      env: GHCR_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
